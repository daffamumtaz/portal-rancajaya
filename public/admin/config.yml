backend:
  name: git-gateway
  branch: main
  squash_merges: true

# Entri disimpan sebagai Draf/Siap di branch utama dan baru terlihat publik
# setelah halaman Rilis Batch mengubahnya menjadi Terbit dalam satu commit.
publish_mode: simple
show_preview_links: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "id"

collections:
  - name: "berita"
    label: "Berita & Informasi"
    label_singular: "Informasi"
    folder: "src/content/berita"
    create: true
    delete: false
    publish: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{category}} - {{title}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
      - { label: "Sudah terbit", field: "release_status", pattern: "Terbit" }
    view_groups:
      - { label: "Kategori", field: "category" }
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options: ["Berita", "Agenda", "Artikel", "Pengumuman"]
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Ringkasan", name: "excerpt", widget: "text" }
      - { label: "Penulis", name: "author", widget: "string", default: "Admin Desa" }
      - { label: "Tampilkan di Beranda", name: "featured", widget: "boolean", default: false }
      - { label: "Konten", name: "body", widget: "markdown" }
      - &release_status
        label: "Status Rilis Batch"
        name: "release_status"
        widget: "select"
        options:
          - { label: "Draf", value: "Draf" }
          - { label: "Siap rilis", value: "Siap" }
          - { label: "Terbit (diatur sistem)", value: "Terbit" }
        default: "Draf"
        hint: "Pilih Siap rilis setelah konten diperiksa. Konten diterbitkan bersama melalui menu Rilis Batch."
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "struktur-organisasi"
    label: "Struktur Organisasi Tree"
    label_singular: "Posisi Struktur"
    folder: "src/content/struktur-organisasi"
    create: false
    delete: false
    publish: false
    identifier_field: "nama"
    summary: "{{jabatan}} - {{nama}}"
    sortable_fields: ["urutan", "jabatan", "nama"]
    view_filters:
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
    fields:
      - { label: "Nama", name: "nama", widget: "string" }
      - { label: "Jabatan", name: "jabatan", widget: "string" }
      - label: "Atasan Langsung"
        name: "parent"
        widget: "relation"
        collection: "struktur-organisasi"
        search_fields: ["nama", "jabatan"]
        value_field: "{{slug}}"
        display_fields: ["{{jabatan}} - {{nama}}"]
        required: false
        hint: "Kosongkan hanya untuk Kepala Desa."
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", min: 1, default: 1 }
      - { label: "Deskripsi", name: "deskripsi", widget: "text", required: false }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "dusun"
    label: "Dusun"
    label_singular: "Dusun"
    folder: "src/content/dusun"
    create: false
    delete: false
    publish: false
    identifier_field: "nama"
    summary: "{{nama}} - {{jumlah_penduduk}} jiwa"
    sortable_fields: ["urutan", "nama", "jumlah_penduduk"]
    fields:
      - { label: "Nama Dusun", name: "nama", widget: "string" }
      - { label: "Kepala Dusun", name: "kepala_dusun", widget: "string", required: false }
      - { label: "Jumlah Penduduk", name: "jumlah_penduduk", widget: "number", value_type: "int", min: 0, required: false }
      - { label: "Luas Wilayah", name: "luas_wilayah", widget: "string", required: false }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", min: 1, default: 1 }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "apbdes"
    label: "Transparansi APBDes"
    label_singular: "Pos APBDes"
    folder: "src/content/apbdes"
    create: true
    delete: false
    publish: false
    identifier_field: "nama"
    summary: "{{tahun}} - {{jenis}} - {{nama}}"
    sortable_fields: ["tahun", "jenis", "jumlah", "nama"]
    view_filters:
      - { label: "Pendapatan", field: "jenis", pattern: "Pendapatan" }
      - { label: "Belanja", field: "jenis", pattern: "Belanja" }
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
    view_groups:
      - { label: "Tahun Anggaran", field: "tahun" }
    fields:
      - { label: "Nama Sumber atau Pos", name: "nama", widget: "string" }
      - label: "Jenis"
        name: "jenis"
        widget: "select"
        options: ["Pendapatan", "Belanja"]
      - { label: "Tahun Anggaran", name: "tahun", widget: "number", value_type: "int", min: 2000, max: 2100, default: 2026 }
      - { label: "Jumlah Rupiah", name: "jumlah", widget: "number", value_type: "int", min: 0 }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", min: 1, default: 1 }
      - { label: "Deskripsi", name: "deskripsi", widget: "text", required: false }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "potensi-statistik"
    label: "Statistik Potensi"
    label_singular: "Statistik Potensi"
    folder: "src/content/potensi-statistik"
    create: true
    delete: false
    publish: false
    identifier_field: "label"
    summary: "{{kategori}} - {{label}}: {{value}}"
    sortable_fields: ["kategori", "urutan", "label"]
    view_filters:
      - { label: "Pertanian", field: "kategori", pattern: "Pertanian" }
      - { label: "Peternakan", field: "kategori", pattern: "Peternakan" }
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
    fields:
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Pertanian", "Peternakan"]
      - { label: "Label", name: "label", widget: "string" }
      - { label: "Nilai", name: "value", widget: "string" }
      - { label: "Keterangan", name: "keterangan", widget: "text", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", min: 1, default: 1 }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "kelompok-tani"
    label: "Kelompok Tani"
    label_singular: "Kelompok Tani"
    folder: "src/content/kelompok-tani"
    create: true
    delete: false
    publish: false
    identifier_field: "nama"
    summary: "{{nama}} - {{dusun}}"
    sortable_fields: ["nama", "dusun", "jumlah_anggota"]
    view_filters:
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
    fields:
      - { label: "Nama Kelompok", name: "nama", widget: "string" }
      - { label: "Ketua", name: "ketua", widget: "string" }
      - label: "Dusun"
        name: "dusun"
        widget: "relation"
        collection: "dusun"
        search_fields: ["nama"]
        value_field: "nama"
        display_fields: ["nama"]
      - { label: "Komoditas Utama", name: "komoditas_utama", widget: "string" }
      - { label: "Jumlah Anggota", name: "jumlah_anggota", widget: "number", value_type: "int", min: 0 }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Kontak", name: "kontak", widget: "string", required: false }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "umkm"
    label: "UMKM"
    label_singular: "UMKM"
    folder: "src/content/umkm"
    create: true
    delete: false
    publish: false
    identifier_field: "nama"
    summary: "{{nama}} - {{kategori}}"
    sortable_fields: ["nama", "kategori", "dusun"]
    view_filters:
      - { label: "Unggulan", field: "featured", pattern: true }
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
    fields:
      - { label: "Nama UMKM", name: "nama", widget: "string" }
      - { label: "Pemilik", name: "pemilik", widget: "string" }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Makanan", "Minuman", "Kerajinan", "Jasa", "Pertanian", "Lainnya"]
      - { label: "Produk Utama", name: "produk_utama", widget: "string" }
      - label: "Dusun"
        name: "dusun"
        widget: "relation"
        collection: "dusun"
        search_fields: ["nama"]
        value_field: "nama"
        display_fields: ["nama"]
        required: false
      - { label: "Kontak", name: "kontak", widget: "string", required: false }
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Tampilkan sebagai Unggulan", name: "featured", widget: "boolean", default: false }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "layanan-administrasi"
    label: "Administrasi Daring"
    label_singular: "Layanan Administrasi"
    folder: "src/content/layanan-administrasi"
    create: true
    delete: false
    publish: false
    identifier_field: "nama"
    summary: "{{nama}}"
    sortable_fields: ["urutan", "nama"]
    view_filters:
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
    fields:
      - { label: "Nama Layanan", name: "nama", widget: "string" }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Link Formulir", name: "link", widget: "string", required: false, pattern: ["^(https?://|/).+$", "Gunakan URL http(s) atau path internal yang diawali /." ] }
      - { label: "Ikon atau Singkatan", name: "ikon", widget: "string", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", min: 1, default: 1 }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "kontak"
    label: "Kontak"
    label_singular: "Kontak"
    folder: "src/content/kontak"
    create: true
    delete: false
    publish: false
    identifier_field: "nama"
    summary: "{{jenis}} - {{nama}}"
    sortable_fields: ["urutan", "jenis", "nama"]
    view_filters:
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
    fields:
      - { label: "Nama Kontak", name: "nama", widget: "string" }
      - label: "Jenis"
        name: "jenis"
        widget: "select"
        options: ["Desa", "Kesehatan", "Keamanan", "Darurat", "Layanan"]
      - { label: "Telepon", name: "telepon", widget: "string" }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Alamat", name: "alamat", widget: "string", required: false }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", min: 1, default: 1 }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "faq"
    label: "FAQ"
    label_singular: "FAQ"
    folder: "src/content/faq"
    create: true
    delete: false
    publish: false
    identifier_field: "pertanyaan"
    summary: "{{kategori}} - {{pertanyaan}}"
    sortable_fields: ["urutan", "kategori", "pertanyaan"]
    view_filters:
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
    fields:
      - { label: "Pertanyaan", name: "pertanyaan", widget: "string" }
      - { label: "Jawaban", name: "jawaban", widget: "text" }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Administrasi", "Layanan", "Umum", "Potensi"]
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", min: 1, default: 1 }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "galeri"
    label: "Galeri Foto"
    label_singular: "Foto Galeri"
    folder: "src/content/galeri"
    create: true
    delete: false
    publish: false
    identifier_field: "judul"
    summary: "{{tanggal}} - {{judul}}"
    sortable_fields: ["tanggal", "kategori", "judul"]
    view_filters:
      - { label: "Siap rilis batch", field: "release_status", pattern: "Siap" }
    view_groups:
      - { label: "Kategori", field: "kategori" }
    fields:
      - { label: "Judul", name: "judul", widget: "string" }
      - { label: "Tanggal", name: "tanggal", widget: "date" }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Kegiatan", "Pembangunan", "Budaya", "Pertanian", "Peternakan", "UMKM", "Potensi", "Lainnya"]
      - { label: "Foto", name: "foto", widget: "image" }
      - { label: "Teks Alternatif Foto", name: "alt_text", widget: "string", required: false, hint: "Jelaskan isi foto untuk aksesibilitas." }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - *release_status
      - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "pengaturan"
    label: "Pengaturan"
    publish: false
    files:
      - label: "Pengaturan Umum"
        name: "umum"
        file: "src/content/pengaturan/umum.json"
        fields:
          - { label: "Nama Desa", name: "nama_desa", widget: "string" }
          - { label: "Kecamatan", name: "kecamatan", widget: "string" }
          - { label: "Kabupaten", name: "kabupaten", widget: "string" }
          - { label: "Provinsi", name: "provinsi", widget: "string" }
          - { label: "Visi", name: "visi", widget: "text" }
          - { label: "Sejarah Singkat", name: "sejarah", widget: "markdown" }
          - label: "Misi"
            name: "misi"
            widget: "list"
            field: { label: "Butir Misi", name: "item", widget: "string" }
          - { label: "Alamat Kantor", name: "alamat_kantor", widget: "text" }
          - { label: "Telepon", name: "telepon", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Jam Operasional", name: "jam_operasional", widget: "text" }
          - { label: "Lintang Kantor Desa", name: "koordinat_latitude", widget: "number", value_type: "float", min: -90, max: 90, step: 0.000001, default: -6.3797 }
          - { label: "Bujur Kantor Desa", name: "koordinat_longitude", widget: "number", value_type: "float", min: -180, max: 180, step: 0.000001, default: 107.6461 }
          - { label: "Zoom Peta", name: "peta_zoom", widget: "number", value_type: "int", min: 1, max: 21, default: 18 }
          - { label: "Sumber Koordinat", name: "sumber_koordinat", widget: "text", required: false }
          - { label: "Tahun APBDes Aktif", name: "tahun_apbdes_aktif", widget: "number", value_type: "int", min: 2000, max: 2100, default: 2026 }
          - *release_status
          - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

  - name: "halaman"
    label: "Halaman Website"
    publish: false
    files:
      - label: "Halaman Beranda"
        name: "beranda"
        file: "src/content/halaman/beranda.json"
        fields:
          - { label: "Judul Hero", name: "hero_title", widget: "string" }
          - { label: "Subjudul Hero", name: "hero_subtitle", widget: "string" }
          - { label: "Gambar Latar Hero", name: "hero_bg", widget: "image", required: false }
          - { label: "Judul Sorotan", name: "highlight_title", widget: "string" }
          - { label: "Deskripsi Sorotan", name: "highlight_desc", widget: "text" }
          - { label: "Gambar Sorotan", name: "highlight_image", widget: "image", required: false }
          - label: "Statistik"
            name: "statistik"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Nilai", name: "value", widget: "string" }
          - *release_status
          - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

      - label: "Halaman Profil"
        name: "profil"
        file: "src/content/halaman/profil.json"
        fields:
          - { label: "Kata Sambutan", name: "sambutan", widget: "text" }
          - { label: "Nama Kepala Desa", name: "nama_kades", widget: "string" }
          - { label: "Foto Kepala Desa", name: "foto_kades", widget: "image", required: false }
          - { label: "Luas Wilayah (km2)", name: "luas_wilayah", widget: "string" }
          - { label: "Total Penduduk", name: "penduduk_total", widget: "string" }
          - { label: "Penduduk Pria", name: "penduduk_pria", widget: "string" }
          - { label: "Penduduk Wanita", name: "penduduk_wanita", widget: "string" }
          - label: "Batas Wilayah"
            name: "batas_wilayah"
            widget: "list"
            fields:
              - { label: "Arah", name: "arah", widget: "string" }
              - { label: "Wilayah", name: "wilayah", widget: "string" }
          - label: "Demografi Pendidikan"
            name: "demo_pendidikan"
            widget: "list"
            fields:
              - { label: "Tingkat Pendidikan", name: "label", widget: "string" }
              - { label: "Jumlah", name: "value", widget: "number", value_type: "int", min: 0 }
          - *release_status
          - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

      - label: "Halaman Potensi"
        name: "pertanian"
        file: "src/content/halaman/pertanian.json"
        fields:
          - { label: "Judul Hero", name: "hero_title", widget: "string" }
          - { label: "Subjudul Hero", name: "hero_subtitle", widget: "text" }
          - { label: "Deskripsi Potensi", name: "deskripsi", widget: "text" }
          - *release_status
          - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }

      - label: "Halaman Layanan"
        name: "layanan"
        file: "src/content/halaman/layanan.json"
        fields:
          - { label: "Judul Hero", name: "hero_title", widget: "string", required: false }
          - { label: "Subjudul Hero", name: "hero_subtitle", widget: "text", required: false }
          - *release_status
          - { label: "Tampilkan di Publik", name: "aktif", widget: "boolean", default: true }
