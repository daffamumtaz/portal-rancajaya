backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "id"

collections:
  - name: "berita"
    label: "Berita & Informasi"
    folder: "src/content/berita"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options: ["Berita", "Agenda", "Artikel", "Pengumuman"]
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Ringkasan", name: "excerpt", widget: "text" }
      - { label: "Penulis", name: "author", widget: "string", default: "Admin Desa" }
      - { label: "Tampilkan di Beranda", name: "featured", widget: "boolean", default: false }
      - { label: "Konten", name: "body", widget: "markdown" }

  - name: "struktur-organisasi"
    label: "Struktur Organisasi Tree"
    folder: "src/content/struktur-organisasi"
    create: true
    identifier_field: "nama"
    fields:
      - { label: "Nama", name: "nama", widget: "string" }
      - { label: "Jabatan", name: "jabatan", widget: "string" }
      - { label: "Parent ID/Jabatan", name: "parent", widget: "string", required: false, hint: "Kosongkan untuk node paling atas. Isi dengan slug/ID parent untuk struktur tree." }
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", default: 1 }
      - { label: "Deskripsi", name: "deskripsi", widget: "text", required: false }

  - name: "dusun"
    label: "Dusun"
    folder: "src/content/dusun"
    create: true
    identifier_field: "nama"
    fields:
      - { label: "Nama Dusun", name: "nama", widget: "string" }
      - { label: "Kepala Dusun", name: "kepala_dusun", widget: "string", required: false }
      - { label: "Jumlah Penduduk", name: "jumlah_penduduk", widget: "number", value_type: "int", required: false }
      - { label: "Luas Wilayah", name: "luas_wilayah", widget: "string", required: false }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", default: 1 }

  - name: "apbdes"
    label: "Transparansi APBDes"
    folder: "src/content/apbdes"
    create: true
    identifier_field: "nama"
    fields:
      - { label: "Nama Sumber/Pos", name: "nama", widget: "string" }
      - label: "Jenis"
        name: "jenis"
        widget: "select"
        options: ["Pendapatan", "Belanja"]
      - { label: "Tahun", name: "tahun", widget: "string", default: "2026" }
      - { label: "Jumlah Rupiah", name: "jumlah", widget: "number", value_type: "int" }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", default: 1 }
      - { label: "Deskripsi", name: "deskripsi", widget: "text", required: false }

  - name: "potensi-statistik"
    label: "Statistik Potensi"
    folder: "src/content/potensi-statistik"
    create: true
    identifier_field: "label"
    fields:
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Pertanian", "Peternakan"]
      - { label: "Label", name: "label", widget: "string" }
      - { label: "Nilai", name: "value", widget: "string" }
      - { label: "Keterangan", name: "keterangan", widget: "text", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", default: 1 }

  - name: "kelompok-tani"
    label: "Kelompok Tani"
    folder: "src/content/kelompok-tani"
    create: true
    identifier_field: "nama"
    fields:
      - { label: "Nama Kelompok", name: "nama", widget: "string" }
      - { label: "Ketua", name: "ketua", widget: "string" }
      - { label: "Dusun", name: "dusun", widget: "string" }
      - { label: "Komoditas Utama", name: "komoditas_utama", widget: "string" }
      - { label: "Jumlah Anggota", name: "jumlah_anggota", widget: "number", value_type: "int" }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Kontak", name: "kontak", widget: "string", required: false }

  - name: "umkm"
    label: "UMKM"
    folder: "src/content/umkm"
    create: true
    identifier_field: "nama"
    fields:
      - { label: "Nama UMKM", name: "nama", widget: "string" }
      - { label: "Pemilik", name: "pemilik", widget: "string" }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Makanan", "Minuman", "Kerajinan", "Jasa", "Pertanian", "Lainnya"]
      - { label: "Produk Utama", name: "produk_utama", widget: "string" }
      - { label: "Dusun", name: "dusun", widget: "string", required: false }
      - { label: "Kontak", name: "kontak", widget: "string", required: false }
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Tampilkan Unggulan", name: "featured", widget: "boolean", default: false }

  - name: "layanan-administrasi"
    label: "Administrasi Daring"
    folder: "src/content/layanan-administrasi"
    create: true
    identifier_field: "nama"
    fields:
      - { label: "Nama Layanan", name: "nama", widget: "string" }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Link Formulir", name: "link", widget: "string", required: false }
      - { label: "Ikon atau Singkatan", name: "ikon", widget: "string", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", default: 1 }

  - name: "kontak"
    label: "Kontak"
    folder: "src/content/kontak"
    create: true
    identifier_field: "nama"
    fields:
      - { label: "Nama Kontak", name: "nama", widget: "string" }
      - label: "Jenis"
        name: "jenis"
        widget: "select"
        options: ["Desa", "Kesehatan", "Keamanan", "Darurat", "Layanan"]
      - { label: "Telepon", name: "telepon", widget: "string" }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Alamat", name: "alamat", widget: "string", required: false }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", default: 1 }

  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    identifier_field: "pertanyaan"
    fields:
      - { label: "Pertanyaan", name: "pertanyaan", widget: "string" }
      - { label: "Jawaban", name: "jawaban", widget: "text" }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Administrasi", "Layanan", "Umum", "Potensi"]
      - { label: "Urutan", name: "urutan", widget: "number", value_type: "int", default: 1 }

  - name: "galeri"
    label: "Galeri Foto"
    folder: "src/content/galeri"
    create: true
    identifier_field: "judul"
    fields:
      - { label: "Judul", name: "judul", widget: "string" }
      - { label: "Tanggal", name: "tanggal", widget: "date" }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Kegiatan", "Pembangunan", "Budaya", "Pertanian", "Peternakan", "UMKM", "Potensi", "Lainnya"]
      - { label: "Foto", name: "foto", widget: "image" }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }

  - name: "pengaturan"
    label: "Pengaturan"
    files:
      - label: "Pengaturan Umum"
        name: "umum"
        file: "src/content/pengaturan/umum.json"
        fields:
          - { label: "Nama Desa", name: "nama_desa", widget: "string" }
          - { label: "Kecamatan", name: "kecamatan", widget: "string" }
          - { label: "Kabupaten", name: "kabupaten", widget: "string" }
          - { label: "Provinsi", name: "provinsi", widget: "string" }
          - { label: "Visi", name: "visi", widget: "text" }
          - { label: "Sejarah Singkat", name: "sejarah", widget: "markdown" }
          - label: "Misi"
            name: "misi"
            widget: "list"
            field: { label: "Item Misi", name: "item", widget: "string" }
          - { label: "Alamat Kantor", name: "alamat_kantor", widget: "text" }
          - { label: "Telepon", name: "telepon", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Jam Operasional", name: "jam_operasional", widget: "text" }

  - name: "halaman"
    label: "Halaman Website"
    files:
      - label: "Halaman Beranda"
        name: "beranda"
        file: "src/content/halaman/beranda.json"
        fields:
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "string" }
          - { label: "Hero Background Image", name: "hero_bg", widget: "image", required: false }
          - { label: "Highlight Title", name: "highlight_title", widget: "string" }
          - { label: "Highlight Description", name: "highlight_desc", widget: "text" }
          - { label: "Highlight Image", name: "highlight_image", widget: "image", required: false }
          - label: "Statistik"
            name: "statistik"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }

      - label: "Halaman Profil"
        name: "profil"
        file: "src/content/halaman/profil.json"
        fields:
          - { label: "Kata Sambutan", name: "sambutan", widget: "text" }
          - { label: "Nama Kepala Desa", name: "nama_kades", widget: "string" }
          - { label: "Foto Kepala Desa", name: "foto_kades", widget: "image", required: false }
          - { label: "Luas Wilayah (km2)", name: "luas_wilayah", widget: "string" }
          - { label: "Total Penduduk", name: "penduduk_total", widget: "string" }
          - { label: "Penduduk Pria", name: "penduduk_pria", widget: "string" }
          - { label: "Penduduk Wanita", name: "penduduk_wanita", widget: "string" }
          - label: "Batas Wilayah"
            name: "batas_wilayah"
            widget: "list"
            fields:
              - { label: "Arah", name: "arah", widget: "string" }
              - { label: "Wilayah", name: "wilayah", widget: "string" }
          - label: "Demografi Pendidikan"
            name: "demo_pendidikan"
            widget: "list"
            fields:
              - { label: "Tingkat Pendidikan", name: "label", widget: "string" }
              - { label: "Jumlah", name: "value", widget: "number", value_type: "int" }

      - label: "Halaman Potensi"
        name: "pertanian"
        file: "src/content/halaman/pertanian.json"
        fields:
          - { label: "Judul Hero", name: "hero_title", widget: "string" }
          - { label: "Subtitle Hero", name: "hero_subtitle", widget: "text" }
          - { label: "Deskripsi Potensi", name: "deskripsi", widget: "text" }

      - label: "Halaman Layanan"
        name: "layanan"
        file: "src/content/halaman/layanan.json"
        fields:
          - { label: "Judul Hero", name: "hero_title", widget: "string", required: false }
          - { label: "Subtitle Hero", name: "hero_subtitle", widget: "text", required: false }
