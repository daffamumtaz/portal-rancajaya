backend:
  name: github
  repo: portalrancajaya/portalrancajaya.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: portalrancajayaauth.netlify.app
show_preview_links: true
media_folder: public/images/uploads
public_folder: /images/uploads
locale: id
collections:
  - name: berita
    label: Publikasi — Berita & Informasi
    label_singular: Informasi
    folder: src/content/berita
    create: true
    delete: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{category}} - {{title}}"
    sortable_fields:
      - date
      - title
      - category
    view_filters:
      - label: Draf
        field: release_status
        pattern: Draf
      - label: Terbit
        field: release_status
        pattern: Terbit
    view_groups:
      - label: Kategori
        field: category
    fields:
      - label: Judul
        name: title
        widget: string
        hint: Masukkan judul singkat yang mudah dipahami warga.
      - label: Tanggal
        name: date
        widget: datetime
        hint: Pilih tanggal publikasi informasi.
      - label: Kategori
        name: category
        widget: select
        options:
          - Berita
          - Agenda
          - Artikel
          - Pengumuman
        hint: Isi kategori sesuai data terbaru dan sumber yang tersedia.
      - label: Thumbnail
        name: thumbnail
        widget: image
        required: false
        hint: Unggah gambar pendukung. Maksimal 5 MB.
      - label: Ringkasan
        name: excerpt
        widget: text
        hint: Tulis ringkasan singkat yang tampil pada daftar informasi.
      - label: Penulis
        name: author
        widget: string
        default: Admin Desa
        hint: Masukkan nama penulis atau unit yang menerbitkan.
      - label: Tautan Artikel Lengkap
        name: external_url
        widget: string
        required: false
        hint: Isi jika artikel memiliki versi lengkap di media lain.
      - label: Nama Media Sumber
        name: external_source
        widget: string
        required: false
        hint: "Contoh: Kompasiana, Good News From Indonesia, atau IDN Times."
      - label: Tampilkan di Beranda
        name: featured
        widget: boolean
        default: false
        hint: Aktifkan jika konten perlu ditonjolkan di beranda.
      - label: Konten
        name: body
        widget: markdown
        hint: Tulis isi lengkap. Gunakan judul dan paragraf agar mudah dibaca.
      - &a1
        label: Status Publikasi
        name: release_status
        widget: select
        options:
          - label: Draf
            value: Draf
          - label: Terbit
            value: Terbit
        default: Terbit
        hint: Pilih Draf jika konten belum boleh tampil. Pilih Terbit agar konten muncul
          setelah situs selesai dibangun.
      - label: Tampilkan di Publik
        name: aktif
        widget: boolean
        default: true
        hint: Nonaktifkan untuk menyimpan data tanpa menampilkannya di situs.
  - name: galeri
    label: Publikasi — Galeri Foto
    label_singular: Foto Galeri
    folder: src/content/galeri
    create: true
    delete: false
    identifier_field: judul
    summary: "{{tanggal}} - {{judul}}"
    sortable_fields:
      - tanggal
      - kategori
      - judul
    view_filters:
      - label: Draf
        field: release_status
        pattern: Draf
    view_groups:
      - label: Kategori
        field: kategori
    fields:
      - label: Judul
        name: judul
        widget: string
        hint: Masukkan judul singkat yang menjelaskan isi data atau foto.
      - label: Tanggal
        name: tanggal
        widget: datetime
        hint: Pilih tanggal kegiatan atau pengambilan foto. Jam tidak digunakan.
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - label: Kategori
        name: kategori
        widget: select
        options:
          - Kegiatan
          - Pembangunan
          - Budaya
          - Pertanian
          - Peternakan
          - UMKM
          - Potensi
          - Lainnya
        hint: Pilih kategori yang paling sesuai.
      - label: Foto
        name: foto
        widget: image
        hint: Unggah foto. Maksimal 5 MB.
      - label: Teks Alternatif Foto
        name: alt_text
        widget: string
        required: false
        hint: Jelaskan isi foto untuk aksesibilitas.
      - label: Deskripsi
        name: deskripsi
        widget: text
        hint: Tulis penjelasan singkat dan jelas untuk publik.
      - *a1
      - label: Tampilkan di Publik
        name: aktif
        widget: boolean
        default: true
        hint: Nonaktifkan untuk menyimpan data tanpa menampilkannya di situs.
  - name: halaman-beranda
    label: Halaman — Beranda
    label_singular: Beranda
    files:
      - label: Beranda
        name: beranda
        file: src/content/halaman/beranda.json
        fields:
          - label: Judul Hero
            name: hero_title
            widget: string
            hint: Isi judul hero sesuai data terbaru dan sumber yang tersedia.
          - label: Subjudul Hero
            name: hero_subtitle
            widget: string
            hint: Isi subjudul hero sesuai data terbaru dan sumber yang tersedia.
          - label: Gambar Latar Hero
            name: hero_bg
            widget: image
            required: false
            hint: Unggah gambar latar bagian utama. Maksimal 5 MB.
          - label: Judul Sorotan
            name: highlight_title
            widget: string
            hint: Isi judul sorotan sesuai data terbaru dan sumber yang tersedia.
          - label: Deskripsi Sorotan
            name: highlight_desc
            widget: text
            hint: Isi deskripsi sorotan sesuai data terbaru dan sumber yang tersedia.
          - label: Gambar Sorotan
            name: highlight_image
            widget: image
            required: false
            hint: Unggah gambar sorotan. Maksimal 5 MB.
          - label: Statistik
            name: statistik
            widget: list
            fields:
              - label: Label
                name: label
                widget: string
                hint: Masukkan label singkat yang akan tampil di situs.
              - label: Nilai
                name: value
                widget: string
                hint: Masukkan nilai yang akan ditampilkan.
            hint: Isi statistik sesuai data terbaru dan sumber yang tersedia.
            collapsed: true
          - *a1
          - label: Tampilkan di Publik
            name: aktif
            widget: boolean
            default: true
            hint: Nonaktifkan untuk menyimpan data tanpa menampilkannya di situs.
  - name: halaman-profil
    label: Profil Desa — Data & Organisasi
    label_singular: Profil Desa & Struktur Organisasi
    files:
      - label: Profil Desa & Struktur Organisasi
        name: profil
        file: src/content/halaman/profil.json
        fields:
          - label: Kata Sambutan
            name: sambutan
            widget: text
            hint: Tulis kata sambutan untuk halaman profil desa.
          - label: Nama Kepala Desa
            name: nama_kades
            widget: string
            hint: Masukkan nama Kepala Desa yang sedang menjabat.
          - label: Luas Wilayah (km2)
            name: luas_wilayah
            widget: string
            hint: Isi luas wilayah (km2) sesuai data terbaru dan sumber yang tersedia.
          - label: Total Penduduk
            name: penduduk_total
            widget: string
            hint: Isi total penduduk sesuai data terbaru dan sumber yang tersedia.
          - label: Penduduk Pria
            name: penduduk_pria
            widget: string
            hint: Isi penduduk pria sesuai data terbaru dan sumber yang tersedia.
          - label: Penduduk Wanita
            name: penduduk_wanita
            widget: string
            hint: Isi penduduk wanita sesuai data terbaru dan sumber yang tersedia.
          - label: Tahun Data Wilayah
            name: tahun_wilayah
            widget: number
            value_type: int
            min: 2000
            max: 2100
            required: false
            hint: Isi tahun data wilayah sesuai data terbaru dan sumber yang tersedia.
          - label: Sumber Data Wilayah
            name: sumber_wilayah
            widget: string
            required: false
            hint: Isi sumber data wilayah sesuai data terbaru dan sumber yang tersedia.
          - label: Status Validasi Wilayah
            name: status_validasi_wilayah
            widget: select
            options:
              - Perlu Verifikasi
              - Terverifikasi
            default: Perlu Verifikasi
            hint: Isi status validasi wilayah sesuai data terbaru dan sumber yang tersedia.
          - label: Batas Wilayah
            name: batas_wilayah
            widget: list
            fields:
              - label: Arah
                name: arah
                widget: string
                hint: Isi arah sesuai data terbaru dan sumber yang tersedia.
              - label: Wilayah
                name: wilayah
                widget: string
                hint: Isi wilayah sesuai data terbaru dan sumber yang tersedia.
            hint: Isi batas wilayah sesuai data terbaru dan sumber yang tersedia.
            collapsed: true
          - label: Demografi Pendidikan
            name: demo_pendidikan
            widget: list
            fields:
              - label: Tingkat Pendidikan
                name: label
                widget: string
                hint: Masukkan label singkat yang akan tampil di situs.
              - label: Jumlah
                name: value
                widget: number
                value_type: int
                min: 0
                hint: Masukkan nilai yang akan ditampilkan.
            hint: Isi demografi pendidikan sesuai data terbaru dan sumber yang tersedia.
            collapsed: true
          - label: Demografi Kelompok Umur
            name: demografi_umur
            widget: list
            fields:
              - label: Kelompok Umur
                name: label
                widget: string
                hint: Masukkan label singkat yang akan tampil di situs.
              - label: Jumlah Warga
                name: value
                widget: number
                value_type: int
                min: 0
                hint: Masukkan nilai yang akan ditampilkan.
            hint: Isi demografi kelompok umur sesuai data terbaru dan sumber yang tersedia.
            collapsed: true
          - label: Data Pekerjaan Warga
            name: data_pekerjaan_warga
            widget: list
            fields:
              - label: Jenis Pekerjaan
                name: label
                widget: string
                hint: Masukkan label singkat yang akan tampil di situs.
              - label: Jumlah Warga
                name: value
                widget: number
                value_type: int
                min: 0
                hint: Masukkan nilai yang akan ditampilkan.
            hint: Isi data pekerjaan warga sesuai data terbaru dan sumber yang tersedia.
            collapsed: true
          - label: Status Pernikahan
            name: status_pernikahan
            widget: list
            fields:
              - label: Status
                name: label
                widget: string
                hint: Masukkan label singkat yang akan tampil di situs.
              - label: Jumlah Warga
                name: value
                widget: number
                value_type: int
                min: 0
                hint: Masukkan nilai yang akan ditampilkan.
            hint: Isi status pernikahan sesuai data terbaru dan sumber yang tersedia.
            collapsed: true
          - label: Tahun Data Demografi
            name: tahun_demografi
            widget: number
            value_type: int
            min: 2000
            max: 2100
            required: false
            hint: Isi tahun data demografi sesuai data terbaru dan sumber yang tersedia.
          - label: Sumber Data Demografi
            name: sumber_demografi
            widget: string
            required: false
            hint: Isi sumber data demografi sesuai data terbaru dan sumber yang tersedia.
          - label: Status Validasi Demografi
            name: status_validasi_demografi
            widget: select
            options:
              - Perlu Verifikasi
              - Terverifikasi
            default: Perlu Verifikasi
            hint: Isi status validasi demografi sesuai data terbaru dan sumber yang
              tersedia.
          - *a1
          - label: Tampilkan di Publik
            name: aktif
            widget: boolean
            default: true
            hint: Nonaktifkan untuk menyimpan data tanpa menampilkannya di situs.
          - label: Struktur Organisasi
            name: struktur_organisasi
            widget: list
            fields:
              - label: ID Posisi
                name: slug
                widget: string
                hint: Isi id posisi sesuai data terbaru dan sumber yang tersedia.
              - label: Nama
                name: nama
                widget: string
                hint: Masukkan nama resmi sesuai dokumen atau data sumber.
              - label: Jabatan
                name: jabatan
                widget: string
                hint: Isi jabatan sesuai data terbaru dan sumber yang tersedia.
              - label: ID Atasan
                name: parent
                widget: string
                required: false
                hint: Kosongkan untuk Kepala Desa.
              - label: Foto
                name: foto
                widget: image
                required: false
                hint: Unggah foto. Maksimal 5 MB.
              - label: Urutan
                name: urutan
                widget: number
                value_type: int
                min: 1
                hint: Tentukan urutan tampil, mulai dari angka kecil.
              - label: Deskripsi
                name: deskripsi
                widget: text
                required: false
                hint: Tulis penjelasan singkat dan jelas untuk publik.
              - &a2
                label: Tahun Data
                name: tahun_data
                widget: number
                value_type: int
                min: 2000
                max: 2100
                required: false
                hint: Masukkan tahun sumber data ini.
              - &a3
                label: Sumber Data
                name: sumber_data
                widget: string
                required: false
                hint: Tuliskan dokumen, instansi, atau tautan sumber data.
              - &a4
                label: Status Publikasi
                name: release_status
                widget: select
                options:
                  - label: Draf
                    value: Draf
                  - label: Terbit
                    value: Terbit
                default: Terbit
                hint: Pilih Draf saat belum siap, atau Terbit saat boleh dipublikasikan.
              - &a5
                label: Tampilkan di Publik
                name: aktif
                widget: boolean
                default: true
                hint: Nonaktifkan untuk menyimpan data tanpa menampilkannya di situs.
            hint: Kelola anggota struktur organisasi dan urutan tampilnya.
            collapsed: true
  - name: dusun
    label: Profil Desa — Wilayah & Dusun
    label_singular: Dusun
    folder: src/content/dusun
    create: false
    delete: false
    identifier_field: nama
    summary: "{{nama}} - {{jumlah_penduduk}} jiwa"
    sortable_fields:
      - urutan
      - nama
      - jumlah_penduduk
    fields:
      - label: Nama Dusun
        name: nama
        widget: string
        hint: Masukkan nama resmi sesuai dokumen atau data sumber.
      - label: Kepala Dusun
        name: kepala_dusun
        widget: string
        required: false
        hint: Isi kepala dusun sesuai data terbaru dan sumber yang tersedia.
      - label: Jumlah Penduduk
        name: jumlah_penduduk
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Isi jumlah penduduk sesuai data terbaru dan sumber yang tersedia.
      - label: Jumlah Laki-laki
        name: jumlah_pria
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Isi jumlah laki-laki sesuai data terbaru dan sumber yang tersedia.
      - label: Jumlah Perempuan
        name: jumlah_wanita
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Isi jumlah perempuan sesuai data terbaru dan sumber yang tersedia.
      - label: Jumlah Kepala Keluarga
        name: jumlah_kk
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Isi jumlah kepala keluarga sesuai data terbaru dan sumber yang tersedia.
      - label: Luas Wilayah
        name: luas_wilayah
        widget: string
        required: false
        hint: Isi luas wilayah sesuai data terbaru dan sumber yang tersedia.
      - label: Deskripsi
        name: deskripsi
        widget: text
        hint: Tulis penjelasan singkat dan jelas untuk publik.
      - label: Urutan
        name: urutan
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: Tentukan urutan tampil, mulai dari angka kecil.
      - label: Tahun Data
        name: tahun_data
        widget: number
        value_type: int
        min: 2000
        max: 2100
        required: false
        hint: Masukkan tahun sumber data ini.
      - label: Sumber Data
        name: sumber_data
        widget: string
        required: false
        hint: Tuliskan dokumen, instansi, atau tautan sumber data.
      - label: Status Validasi
        name: status_validasi
        widget: select
        options:
          - Perlu Verifikasi
          - Terverifikasi
        default: Perlu Verifikasi
        hint: Tandai apakah data telah diverifikasi.
      - *a1
      - label: Tampilkan di Publik
        name: aktif
        widget: boolean
        default: true
        hint: Nonaktifkan untuk menyimpan data tanpa menampilkannya di situs.
  - name: apbdes
    label: Transparansi — APBDes per Periode
    label_singular: Periode APBDes
    folder: src/content/apbdes
    create: true
    delete: false
    identifier_field: nama
    summary: "{{tahun}} — APBDes {{versi}}"
    sortable_fields:
      - tahun
      - versi
      - jenis
      - jumlah
      - nama
    view_filters:
      - label: Pendapatan
        field: jenis
        pattern: Pendapatan
      - label: Belanja
        field: jenis
        pattern: Belanja
      - label: Draf
        field: release_status
        pattern: Draf
    view_groups:
      - label: Tahun Anggaran
        field: tahun
    fields:
      - label: Tahun Anggaran
        name: tahun
        widget: number
        value_type: int
        min: 2000
        max: 2100
        hint: Masukkan tahun anggaran atau tahun data.
      - label: Versi APBDes
        name: versi
        widget: select
        options:
          - Awal
          - Perubahan
        hint: Pilih APBDes Awal atau Perubahan.
      - label: Pendapatan
        name: pendapatan
        widget: list
        fields: &a6
          - label: Nama Pos
            name: nama
            widget: string
            hint: Masukkan nama resmi sesuai dokumen atau data sumber.
          - label: Jumlah Rupiah
            name: jumlah
            widget: number
            value_type: int
            min: 0
            hint: Masukkan nilai anggaran dalam rupiah tanpa titik pemisah.
          - label: Realisasi Rupiah
            name: realisasi
            widget: number
            value_type: int
            min: 0
            required: false
            hint: Isi nilai realisasi dalam rupiah bila tersedia.
          - label: Urutan
            name: urutan
            widget: number
            value_type: int
            min: 1
            hint: Tentukan urutan tampil, mulai dari angka kecil.
          - label: Deskripsi
            name: deskripsi
            widget: text
            required: false
            hint: Tulis penjelasan singkat dan jelas untuk publik.
          - label: Tanggal Pembaruan
            name: tanggal_pembaruan
            widget: date
            required: false
            hint: Pilih tanggal terakhir data diperbarui.
          - *a2
          - *a3
          - *a4
          - *a5
        hint: Tambahkan seluruh pos pendapatan untuk periode ini.
        collapsed: true
      - label: Belanja
        name: belanja
        widget: list
        fields: *a6
        hint: Tambahkan seluruh pos belanja untuk periode ini.
        collapsed: true
      - *a4
      - *a5
  - name: halaman-pertanian
    label: Potensi Desa — Pertanian & Peternakan
    label_singular: Potensi Pertanian
    files:
      - label: Potensi Pertanian
        name: pertanian
        file: src/content/halaman/pertanian.json
        fields:
          - label: Judul Hero
            name: hero_title
            widget: string
            hint: Isi judul hero sesuai data terbaru dan sumber yang tersedia.
          - label: Subjudul Hero
            name: hero_subtitle
            widget: text
            hint: Isi subjudul hero sesuai data terbaru dan sumber yang tersedia.
          - label: Deskripsi Potensi
            name: deskripsi
            widget: text
            hint: Tulis penjelasan singkat dan jelas untuk publik.
          - label: Nama Gapoktan
            name: gapoktan_nama
            widget: string
            required: false
            hint: Isi nama gapoktan sesuai data terbaru dan sumber yang tersedia.
          - label: Ketua Gapoktan
            name: gapoktan_ketua
            widget: string
            required: false
            hint: Isi ketua gapoktan sesuai data terbaru dan sumber yang tersedia.
          - label: Narasi Peternakan Domba
            name: peternakan_copywriting
            widget: text
            required: false
            hint: Isi narasi peternakan domba sesuai data terbaru dan sumber yang tersedia.
          - label: Galeri Peternakan
            name: peternakan_galeri
            widget: list
            fields:
              - label: Foto
                name: foto
                widget: image
                hint: Unggah foto. Maksimal 5 MB.
              - label: Teks Alternatif
                name: alt_text
                widget: string
                hint: Jelaskan isi gambar singkat agar dapat diakses semua pengguna.
            hint: Kelola foto peternakan secara terpisah dari data pertanian.
            collapsed: true
          - *a1
          - label: Tampilkan di Publik
            name: aktif
            widget: boolean
            default: true
            hint: Nonaktifkan untuk menyimpan data tanpa menampilkannya di situs.
          - label: Statistik Potensi
            name: statistik_potensi
            widget: list
            fields:
              - label: ID
                name: slug
                widget: string
                hint: Isi id sesuai data terbaru dan sumber yang tersedia.
              - label: Kategori
                name: kategori
                widget: select
                options:
                  - Pertanian
                  - Peternakan
                  - Sarana Pertanian
                hint: Pilih kategori yang paling sesuai.
              - label: Label
                name: label
                widget: string
                hint: Masukkan label singkat yang akan tampil di situs.
              - label: Nilai
                name: value
                widget: string
                hint: Masukkan nilai yang akan ditampilkan.
              - label: Keterangan
                name: keterangan
                widget: text
                required: false
                hint: Tambahkan keterangan bila diperlukan.
              - label: Satuan
                name: satuan
                widget: string
                required: false
                hint: Masukkan satuan, misalnya hektare, ton, atau unit.
              - label: Urutan
                name: urutan
                widget: number
                value_type: int
                min: 1
                hint: Tentukan urutan tampil, mulai dari angka kecil.
              - *a2
              - *a3
              - *a4
              - *a5
            hint: Kelola angka statistik potensi pertanian dan sarana pendukung.
            collapsed: true
          - label: Kelompok Tani
            name: kelompok_tani
            widget: list
            fields:
              - label: ID
                name: slug
                widget: string
                hint: Isi id sesuai data terbaru dan sumber yang tersedia.
              - label: Nama Kelompok
                name: nama
                widget: string
                hint: Masukkan nama resmi sesuai dokumen atau data sumber.
              - label: Ketua
                name: ketua
                widget: string
                hint: Masukkan nama ketua kelompok.
              - label: Dusun
                name: dusun
                widget: string
                required: false
                hint: Pilih atau tuliskan dusun terkait bila ada.
              - label: Komoditas Utama
                name: komoditas_utama
                widget: string
                hint: Masukkan komoditas utama kelompok tani.
              - label: Luas Areal (Ha)
                name: luas_ha
                widget: number
                value_type: float
                min: 0
                hint: Masukkan luas lahan dalam hektare.
              - label: Jumlah Anggota
                name: jumlah_anggota
                widget: number
                value_type: int
                min: 0
                hint: Masukkan jumlah anggota kelompok.
              - label: Deskripsi
                name: deskripsi
                widget: text
                hint: Tulis penjelasan singkat dan jelas untuk publik.
              - label: Kontak
                name: kontak
                widget: string
                required: false
