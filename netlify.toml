[build]
  # Netlify hanya menjadi OAuth proxy. Situs publik dibangun oleh GitHub Pages.
  command = ""
  publish = "public"
  functions = "netlify/functions"
  # Push konten dari Decap tidak perlu membangun ulang proyek Netlify ini.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ netlify.toml"
